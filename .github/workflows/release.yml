# wheel と sdist をビルドしてテストし、main への push で PyPI に登録する。
#
# - develop への push・pull request・手動実行: ビルドとテストだけ (登録しない)。
# - main への push: ビルドとテストに加え、Cargo.toml の version が PyPI にまだなければ登録する
#   (同じ version は PyPI に二度登録できないので、version を上げたときだけ公開される)。
# - wheel は abi3 (CPython の安定 ABI、Python 3.9 以上) で OS・アーキテクチャごとに 1 本。PyO3 0.22 が
#   対応しない新しい Python (3.14 など) にもそのまま入る。
# - wheel は LTO + PGO で作り、x86_64 では base と x86-64-v3 の 2 つの本体を入れる (下の linux の job の説明)。
# - 登録は PyPI の Trusted Publishing (トークン不要)。pypi.org で、このリポジトリの
#   ワークフロー release.yml・環境 pypi を publisher として登録しておく。
name: release

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/enomoto-solver/$version/json")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$code" = "404" ]; then echo "new=true" >> "$GITHUB_OUTPUT"; else echo "new=false" >> "$GITHUB_OUTPUT"; fi
          echo "version $version (PyPI: HTTP $code)"

  # wheel は scripts/build_dist_wheel.sh で作る: LTO (fat、codegen-units 1) + PGO (scripts/pgo_train.py で学習)。
  # x86_64 ではさらに x86-64-v3 向けの _core を _core_v3 として同梱し、読み込むときに CPU を見て選ぶ
  # (ENOMOTO_CORE=auto|base|v3 で強制できる)。PGO の学習は版ごと (base は base の、v3 は v3 の計測用の版で) に行い、
  # 作りのたびに profile と合わない関数 ("hash mismatch") を数えて 0 でなければ止める。
  # 学習は作った wheel を動かすので、どの対象もその機械で直に作る (クロスでは作らない)。
  # 設計と測った結果は analysis/buildopt_20261122/README.md の 7 節。
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
          - target: aarch64
            runner: ubuntu-24.04-arm   # arm の機械で直に作る (PGO の学習を動かすため)
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    env:
      PY: /opt/python/cp313-cp313/bin/python
      # abi3 (Python 3.9 以上)。manylinux_2_28 の確かめと名札付けは maturin が行う
      MATURIN_ARGS: --features pyo3/abi3-py39 --compatibility manylinux_2_28 -i /opt/python/cp313-cp313/bin/python
    steps:
      - uses: actions/checkout@v4
      - name: Rust と maturin
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component llvm-tools
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          $PY -m pip install maturin
          echo "$(dirname $PY)" >> "$GITHUB_PATH"
      - name: wheel (LTO + PGO、x86_64 は base と v3 の 2 本入り)
        run: bash scripts/build_dist_wheel.sh
      - name: manylinux の確かめ (_core と _core_v3 の両方)
        run: auditwheel show dist/*.whl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-linux-${{ matrix.target }}   # 各作りのログ (hash mismatch の数を後から見られる)
          path: target/dist-work/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash   # Git Bash で台本を動かす (rustc に渡すパスは台本が cygpath で C:/... に直す)
    env:
      PY: python
      MATURIN_ARGS: --features pyo3/abi3-py39
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Rust の llvm-tools と maturin
        run: |
          rustup component add llvm-tools
          python -m pip install maturin
      - name: wheel (LTO + PGO + base と v3 の 2 本入り)
        run: bash scripts/build_dist_wheel.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-windows-x64
          path: target/dist-work/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple シリコンは LTO だけ、1 本 (v3 は無い)。PGO の計測用の版 (-Cprofile-generate) が最初の solve で
          # Segmentation fault になる (0.2.0 の CI、2026-11-27)。原因が分かるまで PGO を外す
          - target: aarch64
            runner: macos-15
            pgo: "0"
          - target: x86_64
            runner: macos-15-intel    # Intel の機械で直に作る (PGO の学習を動かすため)。LTO + PGO + 2 本入り
            pgo: "1"
    runs-on: ${{ matrix.runner }}
    env:
      PY: python
      PGO: ${{ matrix.pgo }}
      MATURIN_ARGS: --features pyo3/abi3-py39
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Rust の llvm-tools と maturin
        run: |
          rustup component add llvm-tools
          python -m pip install maturin
      - name: wheel
        run: bash scripts/build_dist_wheel.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-macos-${{ matrix.target }}
          path: target/dist-work/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  # ビルドした wheel を入れて tests/test_model.py を流す (各 OS で Python 3.9・3.13・3.14)。
  test:
    needs: [linux, windows, macos]
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (26.04) には Python 3.9 がないので、テストは 24.04 で回す
        os: [ubuntu-24.04, windows-latest, macos-15]
        python: ["3.9", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links dist enomoto-solver
          cd tests
          # x86_64 の wheel は base と v3 の 2 本入り。auto (CPU を見て選ぶ) と base (強制) の両方で流す
          python -c "import enomoto_solver._core as c; print('cpu v3', c.cpu_x86_64_v3(), 'loaded', c.build_cpu_level())"
          ENOMOTO_CORE=auto python -m pytest -q test_model.py
          ENOMOTO_CORE=base python -c "import enomoto_solver._core as c; assert c.build_cpu_level() == 'base', c.build_cpu_level()"
          ENOMOTO_CORE=base python -m pytest -q test_model.py

  publish:
    needs: [version, test, sdist]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # 配る物 (wheels-* と sdist) だけを集める。build-logs-* の *.log まで dist に入ると、登録が InvalidDistribution で落ちる (0.2.0 の CI)
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
