[package]
name = "enomoto_core"
version = "0.1.3"
edition = "2021"
license = "MIT"
authors = ["Kan Enomoto"]
description = "ENOMOTO-Solver internal engine: CSR storage, preprocessing, optimization algorithms"
# sdist (maturin sdist) に入れるファイル。ベンチマーク結果・解析メモなどは配布物に含めない。
include = ["/src/**/*", "/python/enomoto_solver/*.py", "/.cargo/config.toml", "/Cargo.toml", "/Cargo.lock", "/pyproject.toml", "/README.md", "/LICENSE"]

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
faer = { version = "0.20.2", default-features = false, features = ["std", "linalg", "lu", "rayon"] }
# multifrontal の前線の密な演算 (Cholesky・三角行列の解法・行列積) だけに使う新しい版 (AVX-512 の核を実行時に選ぶので 0.20 より速い)。
faer24 = { package = "faer", version = "0.24", default-features = false, features = ["std", "rayon"] }
pyo3 = { version = "0.22", features = ["extension-module"] }
rayon = "1.10"
mimalloc = { version = "0.1", default-features = false }
metis-sys = "0.3.2"
libloading = "0.8"
