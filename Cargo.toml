[package]
name = "enomoto_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Kan Enomoto"]
description = "ENOMOTO-Solver internal engine: CSR storage, preprocessing, optimization algorithms"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
faer = { version = "0.20.2", default-features = false, features = ["std", "linalg", "lu", "rayon"] }
pyo3 = { version = "0.22", features = ["extension-module"] }
rayon = "1.10"
mimalloc = { version = "0.1", default-features = false }
metis-sys = "0.3.2"
